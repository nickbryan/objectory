version: "2"
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exhaustruct
    - fatcontext
    - forcetypeassert
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - inamedparam
    - ineffassign
    - interfacebloat
    - intrange
    - iotamixing
    - ireturn
    - maintidx
    - makezero
    - mirror
    - misspell
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
  settings:
    copyloopvar:
      check-alias: true
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/go-playground/validator/v10
            - github.com/golang-jwt/jwt/v5
            - github.com/google/go-cmp/cmp
            - github.com/google/uuid
            - github.com/jackc/pgerrcode
            - github.com/jackc/pgx/v5
            - github.com/nickbryan/httputil
            - github.com/nickbryan/objectory
            - github.com/nickbryan/slogutil
            - golang.org/x/crypto/bcrypt
    embeddedstructfieldcheck:
      empty-line: true
    errcheck:
      check-type-assertions: true
      verbose: true
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    exhaustruct:
      allow-empty: true
      exclude:
        - .+/httputil\.Endpoint$
        - ^net/http\.Cookie$
        - ^github\.com/jackc/pgx/v5/pgtype\.Timestamp$
        - ^github\.com/jackc/pgx/v5/tracelog\.TraceLog$
    funlen:
      ignore-comments: true
    gocognit:
      min-complexity: 15
    goconst:
      ignore-tests: true
      ignore-string-values:
        - 'partials/.+'
    gocyclo:
      min-complexity: 15
    grouper:
      const-require-grouping: true
      import-require-grouping: true
    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported
    interfacebloat:
      max: 3
    ireturn:
      allow:
        - anon
        - error
        - empty
        - generic
        - stdlib
        - httputil.Handler
    misspell:
      locale: US
    nestif:
      min-complexity: 7
    nilnil:
      detect-opposite: true
    nlreturn:
      block-size: 2
    nolintlint:
      require-explanation: true
      require-specific: true
    paralleltest:
      check-cleanup: true
    rowserrcheck:
      packages:
        - github.com/jackc/pgx
    sloglint:
      attr-only: true
      no-global: all
      context: all
      static-msg: true
      key-naming-case: snake
      forbidden-keys:
        - time
        - level
        - msg
        - source
    tagalign:
      order:
        - json
        - form
        - param
        - validate
    usestdlibvars:
      time-month: true
      time-date-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true
    wrapcheck:
      extra-ignore-sigs:
        - httputil.Redirect
  exclusions:
    generated: lax
    rules:
      - linters:
          - containedctx
          - cyclop
          - err113
          - exhaustruct
          - funlen
          - gocognit
          - maintidx
          - nestif
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/nickbryan
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
