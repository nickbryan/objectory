{{ template "layouts/base.html" . }}
{{ define "title" }}Dashboard{{ end }}
{{ define "content" }}
<div class="dashboard-content">
    <h1 class="form-title">Welcome, {{ .Name }}!</h1>
    <p class="dashboard-email">{{ .Email }}</p>

</div>
{{ end }}
