<form id="registration-form" hx-post="/actions/register" hx-target="#registration-form" hx-swap="outerHTML">
    <h1 class="form-title">Register</h1>
    
    <div class="form-group">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-input{{ if fieldError .Errors "name" }} form-input-error{{ end }}" placeholder="Name" value="{{ .Name }}">
        {{ with fieldError .Errors "name" }}<div class="form-error">{{ . }}</div>{{ end }}
    </div>
    
    <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-input{{ if fieldError .Errors "email" }} form-input-error{{ end }}" placeholder="Email" value="{{ .Email }}">
        {{ with fieldError .Errors "email" }}<div class="form-error">{{ . }}</div>{{ end }}
    </div>
    
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input{{ if fieldError .Errors "password" }} form-input-error{{ end }}" placeholder="Password">
        {{ with fieldError .Errors "password" }}<div class="form-error">{{ . }}</div>{{ end }}
    </div>
    
    <div class="form-group last">
        <label for="password-confirmation" class="form-label">Password Confirmation</label>
        <input type="password" id="password-confirmation" name="passwordConfirmation" class="form-input{{ if fieldError .Errors "passwordConfirmation" }} form-input-error{{ end }}" placeholder="Password Confirmation">
        {{ with fieldError .Errors "passwordConfirmation" }}<div class="form-error">{{ . }}</div>{{ end }}
    </div>
    
    {{ if .Error }}
    <div class="form-error form-error-global">{{ .Error }}</div>
    {{ end }}
    
    <button type="submit" class="btn-primary">Register</button>
    
    <div class="form-footer">
        <a href="#" hx-get="/partials/login-form" hx-target="#registration-form" hx-swap="outerHTML" class="form-link">Login</a>
    </div>
</form>
