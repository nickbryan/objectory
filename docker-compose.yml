services:
  api:
    container_name: objectory-api
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8081:8080"
    volumes:
      - .:/opt/app/api
    environment:
      - DATABASE_URL=postgres://objectory:secret@objectorydb:5432/objectory?sslmode=disable
      - JWT_KEY=local-dev-jwt-key-change-in-production!
    depends_on:
      database:
        condition: service_healthy
  caddy:
    container_name: objectory-caddy
    image: caddy:latest
    ports:
      - "443:443"
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
  web:
    container_name: objectory-web
    build:
      context: .
      dockerfile: web/Dockerfile
    volumes:
      - .:/opt/app/web
    environment:
      - API_BASE_URL=http://api:8080
    depends_on:
      api:
        condition: service_started
  database:
    container_name: objectorydb
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=objectory
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=objectory
    volumes:
      - ./api/database/:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U objectory"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  database:
  caddy_data:
  caddy_config:
